<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Songspot kit (dev)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/css/app.css">
<link rel="stylesheet" href="/app/css/kit.css">
<link rel="stylesheet" href="/app/css/season.css">
<style>
  body { overflow: auto; background: var(--page); }
  main { position: relative; z-index: 1; max-width: 460px; margin: 0 auto; padding: 0 22px 60px; display: flex; flex-direction: column; }
  .gap { height: 18px; flex: none; }
  .note { color: #6f6f6f; font: 600 11px/1.3 Inter; letter-spacing: 1px; text-transform: uppercase; margin: 34px 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .sym { color: #fff; font-size: 22px; display: inline-grid; place-items: center; width: 40px; height: 40px; background: rgba(255,255,255,.05); border-radius: 8px; }
  .sym small { display: none; }
  .intro { position: relative; height: 420px; border-radius: 20px; overflow: hidden; background: var(--stage); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .intro .k-stagelight { position: absolute; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; padding: 10px 0; background: var(--page); }
  .bar a { color: #a8a8a8; font: 700 12px Inter; text-decoration: none; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.06); }
  .rep-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 2px 0; }
  .rep-head h2 { margin: 0; font: italic 900 24px/29px Inter; letter-spacing: -.8px; color: #f2f2f2; }
  .rep-back .i { width: 20px; height: 20px; } .rep-back { width: 35px; height: 35px; border-radius: 50%; background: rgba(255,255,255,.04); display: grid; place-items: center; color: #a8a8a8; font-size: 14px; }
  .set { display: flex; align-items: center; gap: 8px; height: 44px; }
  .set b { font: 600 14px Inter; color: rgba(255,255,255,.8); flex: 1; }
  .set span { font: 800 14px Inter; color: #fff; }
  .set .c { color: rgba(255,255,255,.6); font-size: 11px; display: grid; }
  .set .c .i { width: 15px; height: 15px; margin: 0 -4.5px; }
  .hair { height: 1px; background: rgba(255,255,255,.12); }
</style>
</head>
<body>
<main id="m"></main>
<script type="module">
import { bootSeason, Season, mountNight, Weather } from '/app/js/season.js';
bootSeason();
if (new URLSearchParams(location.search).has('snow')) Weather.update('Christmas');
const K = await import('/app/js/kit.js');
const { SF, glyph } = await import('/app/js/icons.js');
const { TIER_COLOR } = await import('/app/js/ui.js');
const { PanelColours: P } = K;
const q = new URLSearchParams(location.search);
const only = q.get('only');
const m = document.getElementById('m');
if (q.get('safe')) m.style.paddingTop = q.get('safe') + 'px';
const lv = t => ({ key: t, label: t[0].toUpperCase() + t.slice(1), tint: TIER_COLOR[t], ink: '#08120c', dot: true });
const levels = ['easy', 'medium', 'hard', 'expert', 'impossible'].map(lv);

const parts = {
  acct: `<div class="rep-head"><span class="rep-back">${SF['chevron.left']}</span><h2>SETTINGS</h2><span style="width:35px"></span></div><div style="height:18px"></div>`
    + K.panel({ title: 'Account', note: 'Name, character and plan', icon: 'set-icon-crown', colours: P.green,
      body: K.group(`<div style="padding:0 14px">${[['Name', 'Arn', '#fff', 1], ['Character', 'Change', '#fff', 1], ['Plan', 'Free · Go premium', '#ffe27a', 1], ['Sign out', '', '#fff', 1]].map(([l, v, c, ch]) => `<div class="set"><b>${l}</b><span style="color:${c}">${v}</span>${ch ? `<span class="c">${SF['chevron.right']}</span>` : ''}</div><div class="hair"></div>`).join('')}<div class="set"><b style="font-weight:700;color:#ffc2c6">Delete account</b></div></div>`) }),
  introfull: `<div style="position:fixed;inset:0;background:#070605">${K.stageLight(TIER_COLOR.medium)}<div style="position:absolute;inset:0;display:flex;flex-direction:column;padding:${(+q.get('safe') || 0) + 14}px 24px 44px">
      <div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font:600 9.5px Inter;letter-spacing:2px;color:#a8a8a8">ROUND</div><div style="font:800 26px var(--mono);color:#f2f2f2">3<span style="font:600 13px var(--mono);color:#4a4a4a"> / 10</span></div></div><span style="background:${TIER_COLOR.medium};color:#08120c;font:600 13px Inter;padding:9px 21px;border-radius:99px">Medium</span></div>
      <div style="flex:1"></div>${K.roundBanner({ title: 'ROUND 3', tier: 'medium', subtitle: 'MEDIUM' })}<div style="flex:1"></div>
      <div style="display:flex;justify-content:center">${K.countRing({ number: 0, accent: TIER_COLOR.medium })}</div><div style="height:54px"></div><div style="flex:1"></div><div style="height:52px"></div></div></div>`,
  glyphs: `<div class="note">Glyphs (template PNG, tinted)</div><div class="row">${['animations','artist','artwork','clean','colours','crown','genre','glow','haptics','hint','howto','privacy','restore','search','spotlight'].map((n, i) => glyph(n, Object.values(TIER_COLOR)[i % 5], 22)).join('')}</div>`,
  bar: `<div class="bar"><a href="?">Off season</a><a href="?season=halloween">Halloween</a><a href="?season=christmas">Christmas</a><a href="?season=auto">Calendar</a></div>`,
  title: K.tabTitle('GAMES'),
  settings: [
    `<div class="note">Profile › Settings style panels</div>`,
    K.panel({ title: 'Account', note: 'Name, character and plan', icon: 'set-icon-crown', colours: P.green,
      body: K.group([K.linkRow({ key: 'name', title: 'Name', value: 'Arn', symbol: 'person.fill' }), K.linkRow({ key: 'char', title: 'Character', value: 'Spot', icon: 'ui-icon-friends' }), K.linkRow({ key: 'plan', title: 'Plan', locked: true, symbol: 'crown.fill' })]) }),
    '<div class="gap"></div>',
    K.panel({ title: 'Game', note: 'How a round plays', icon: 'ui-icon-game', colours: P.purple,
      body: K.group([K.switchRow({ key: 'hint', title: 'Free hint', note: 'The artist, once a round', icon: 'ui-icon-hint', on: true }),
        K.switchRow({ key: 'search', title: 'Easy search', note: 'Suggestions after two letters', icon: 'ui-icon-search', on: false }),
        K.linkRow({ key: 'artist', title: 'Artist', value: 'Any artist', icon: 'ui-icon-artist' })]) }),
    '<div class="gap"></div>',
    K.panel({ title: 'Difficulty', note: 'Five levels, from the hits to the deep cuts', icon: 'set-icon-gauge', colours: P.blue,
      body: K.label('Level') + K.chips({ key: 'level', options: levels, selected: 'medium', onColour: true }) }),
    '<div class="gap"></div>',
    K.panel({ title: 'Rounds', note: 'How long a party runs', icon: 'ui-icon-rounds', colours: P.pink,
      body: K.label('Rounds') + K.pills({ key: 'rounds', options: ['5', '10', '15', '20'].map(k => ({ key: k, label: k })), selected: '10', onColour: '#c026d3' })
        + K.label('Time') + K.pills({ key: 'time', options: ['10s', '15s', '20s', '30s', '45s'].map(k => ({ key: k, label: k })), selected: '20s', onColour: '#c026d3' }) }),
    '<div class="gap"></div>',
    K.panel({ title: 'Look and feel', icon: 'ui-icon-lookfeel', colours: P.teal,
      body: K.group([K.switchRow({ key: 'anim', title: 'Animations', icon: 'ui-icon-animations', on: true }), K.switchRow({ key: 'art', title: 'Artwork', icon: 'ui-icon-artwork', on: true }), K.switchRow({ key: 'glow', title: 'Accent glow', icon: 'ui-icon-glow', on: false }), K.switchRow({ key: 'col', title: 'Level colours', icon: 'ui-icon-colours', on: true }), K.switchRow({ key: 'season', title: 'Seasonal theme', icon: 'ui-icon-colours', on: Season.on })]) }),
    '<div class="gap"></div>',
    K.panel({ title: 'Your record', icon: 'set-icon-gauge', colours: P.orange, body: '' }),
    '<div class="gap"></div>',
    K.panel({ title: 'Party', icon: 'game-icon-disco', colours: P.gold, body: K.group(K.linkRow({ key: 'x', title: 'Gold panel', value: 'value' })) }),
    '<div class="gap"></div>',
    K.panel({ title: 'Oops', note: 'That code is not a room.', icon: 'ui-icon-help', colours: P.red, body: '' }),
    '<div class="gap"></div>',
    K.panel({ title: 'Slate', note: 'A quiet one', icon: 'ui-icon-waiting', colours: P.slate, body: '' }),
  ].join(''),
  subtle: [`<div class="note">Calm panels (subtlePanels)</div><div class="k-subtle">`,
    K.panel({ title: 'Game settings', note: 'Only the host can change them', icon: 'ui-icon-teams', colours: P.pink, body: K.group([K.switchRow({ key: 'teams', title: 'Teams', icon: 'ui-icon-teams', on: false }), K.linkRow({ key: 'songs', title: 'Songs', value: 'All genres', icon: 'ui-icon-songs' })]) }),
    '<div class="gap"></div>',
    K.panel({ title: 'Years', icon: 'game-icon-calendar', colours: P.gold, body: K.pills({ key: 'yrs', options: ['All', '80s', '90s', '2000s', '2010s'].map(k => ({ key: k, label: k })), selected: 'All' }) }),
    `</div>`].join(''),
  glossy: [`<div class="note">GlossyLabel</div>`, K.glossy({ title: 'Play again', key: 'again' }), '<div class="gap"></div>', K.glossy({ title: 'Rematch', colours: P.pink, key: 'rematch' }), '<div class="gap"></div>', K.glossy({ title: 'Unlock ranked with Premium', colours: P.gold, key: 'u' })].join(''),
  plain: [`<div class="note">Plain set (GAME SETTINGS sheet)</div>`, K.settingsTitle({ text: 'GAME SETTINGS', done: true }),
    K.section({ title: 'Songs', note: 'What the room plays' }),
    K.card([K.plainSwitch({ key: 'anti', title: 'Anti-Shazam', note: 'Leave the app and the round is lost', symbol: 'shield.lefthalf.filled', on: true }), K.plainLink({ key: 'genre', title: 'Genre', value: 'All genres', symbol: 'music.note.list' }), K.plainLink({ key: 'artist', title: 'Artist', value: '', symbol: 'music.mic', locked: true })]),
    K.section({ title: 'Level' }), K.pills({ key: 'lv', options: levels.map(o => ({ ...o, ink: ({ easy: '#04160b', medium: '#171004', hard: '#180b02', expert: '#1a0507', impossible: '#120421' })[o.key] })), selected: 'easy' }),
    '<div class="gap"></div>', K.chips({ key: 'lv2', options: levels, selected: 'hard', dots: true }),
  ].join(''),
  tiles: `<div class="note">FlatIcon / IconTile (dark, light)</div><div class="row">${Object.keys(K.FlatIcon).map(n => K.iconTile(n, { size: 30 })).join('')}</div><div class="gap"></div><div class="row">${Object.keys(K.FlatIcon).map(n => K.iconTile(n, { size: 42, light: true })).join('')}</div>`,
  symbols: `<div class="note">SF symbols (icons.js SF)</div><div class="row">${Object.entries(SF).map(([n, s]) => `<span class="sym" title="${n}">${s}</span>`).join('')}</div>`,
  intro: [`<div class="note">Round intro</div>`, ...['easy', 'medium', 'hard', 'expert', 'impossible'].map((t, i) => `<div class="intro">${K.stageLight(TIER_COLOR[t])}${K.roundBanner({ title: 'ROUND ' + (i + 1), tier: t, subtitle: t.toUpperCase(), key: 'b' + i })}${i === 0 ? K.countRing({ number: 3, accent: TIER_COLOR[t] }) : ''}${i === 0 ? `<div style="width:220px">${K.countLine({ accent: TIER_COLOR[t] })}</div>` : ''}${K.capsLine('Get ready', '#a8a8a8')}</div><div class="gap"></div>`),
    `<button id="slam" class="note" style="color:#fff">Slam the banners again</button>`].join(''),
};
const order = only ? only.split(',') : ['bar', 'title', 'settings', 'subtle', 'glossy', 'plain', 'intro', 'tiles', 'symbols', 'glyphs'];
m.innerHTML = order.map(k => parts[k] || '').join('');
if (Season.on) mountNight(document.body);
K.wire(m, { switch: (k, on) => { if (k === 'season') { import('/app/js/season.js').then(s => { s.SeasonTheme.enabled = on; location.reload(); }); } }, pick: (g, v) => console.log('pick', g, v), link: k => console.log('link', k) });
const count = m.querySelector('.k-count'), line = m.querySelector('.k-cline');
const loopCount = () => { const ends = Date.now() + 3000; K.runCount(count, ends, { onDone: () => setTimeout(loopCount, 800) }); K.runCountLine(line, ends, 3); };
if (count && !q.has('still') && !only) loopCount();
document.getElementById('slam')?.addEventListener('click', () => { m.querySelectorAll('.k-banner').forEach(b => { K.setBannerShown(b, false); setTimeout(() => K.setBannerShown(b, true), 450); }); });
</script>
</body>
</html>
