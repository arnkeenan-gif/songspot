<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Songspot: Guess the song</title>
<meta name="description" content="Hear a tenth of a second. Name the song. Free on the App Store.">
<meta property="og:title" content="Songspot: Guess the song">
<meta property="og:description" content="Hear a tenth of a second. Name the song. Free on the App Store.">
<meta property="og:image" content="https://songspotapp.com/img/share-card.jpg">
<meta property="og:url" content="https://songspotapp.com/tiktok">
<meta property="og:type" content="website">
<meta name="apple-itunes-app" content="app-id=6808657554">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#030704">
<style>
  :root{color-scheme:dark;--green:#19df70;--ink:#f2f2f2;--mute:#8b918c}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#030704;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    display:grid;place-items:center;padding:24px 16px;text-align:center;
    background-image:radial-gradient(70% 45% at 50% 42%,rgba(25,223,112,.13),transparent 72%);background-attachment:fixed}
  main{width:100%;max-width:340px}
  .icon{width:104px;height:104px;display:block;margin:0 auto}
  h1{font-size:40px;font-weight:800;font-style:italic;letter-spacing:-.04em;margin:18px 0 4px;line-height:1}
    .tag{color:var(--mute);margin:0 0 30px;font-size:16px}
  /* Liquid glass, after Apple's (iOS 26): near-clear, a whisper of frost, a thin specular
     rim brightest where the light hits (top-left, bottom-right), a soft sheen, and a
     highlight that follows the finger. */
  .zone{position:relative;isolation:isolate}
  .get{--x:30%;--y:0%;position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;height:62px;border-radius:999px;color:#fff;font-weight:600;font-size:17px;letter-spacing:-.01em;text-decoration:none;
    background:rgba(255,255,255,.06);
    -webkit-backdrop-filter:blur(2px) saturate(180%) brightness(1.1);backdrop-filter:blur(2px) saturate(180%) brightness(1.1);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 10px 32px rgba(0,0,0,.35),inset 0 1px 1px rgba(255,255,255,.55),inset 0 -1px 1px rgba(255,255,255,.30),
      inset 1px 0 1px rgba(255,255,255,.20),inset -1px 0 1px rgba(255,255,255,.20),inset 0 0 18px rgba(255,255,255,.08);
    text-shadow:0 1px 3px rgba(0,0,0,.35);
    -webkit-tap-highlight-color:transparent;transition:transform .4s cubic-bezier(.2,.9,.25,1.3)}
  /* the specular rim: a thin ring, bright where the light catches it */
  .get::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:1;
    background:linear-gradient(140deg,rgba(255,255,255,.9),rgba(255,255,255,.12) 30%,rgba(255,255,255,0) 50%,rgba(255,255,255,.1) 70%,rgba(255,255,255,.7));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
  /* sheen across the curved surface, and the highlight under the finger */
  .get::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;mix-blend-mode:screen;
    background:linear-gradient(170deg,rgba(255,255,255,.26),rgba(255,255,255,.04) 42%,rgba(255,255,255,0) 60%,rgba(255,255,255,.08)),
      radial-gradient(38% 130% at var(--x) var(--y),rgba(255,255,255,.22),transparent 70%)}
  .get:active{transform:scale(.96)}
  .get svg{width:20px;height:20px;fill:currentColor;margin-top:-2px}
  .free{margin-top:12px;font-size:13px;color:var(--mute)}
  .stuck{margin-top:22px;padding:16px 18px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
    font-size:14px;line-height:1.5;color:#cfd3d0;opacity:0;transform:translateY(6px);transition:opacity .3s ease,transform .3s ease;pointer-events:none}
  .stuck b{color:var(--ink);font-weight:600;white-space:nowrap}
  .stuck .t{display:block;color:var(--ink);font-weight:600;font-size:15px;margin-bottom:4px}
  .stuck.on{opacity:1;transform:none}
</style>
<script>
  // The TikTok bio link. It carries the App Store campaign tag (ct=tiktok), so
  // App Store Connect counts these downloads under "tiktok".
  //
  // Opened in a real browser (Safari, after "Open in browser"), it goes straight
  // on to the App Store. TikTok's and Instagram's in-app browsers often won't open
  // the App Store by themselves, so there the page stays and the player taps the
  // button (a tap is always let through). Link checkers stay on the page too.
  var STORE = 'https://apps.apple.com/app/apple-store/id6808657554?pt=129407387&ct=tiktok&mt=8'
  var ua = navigator.userAgent || ''
  var inApp = /musical_ly|BytedanceWebview|TikTok|Bytedance|Instagram|FBAN|FBAV/i.test(ua)
  var bot = /facebookexternalhit|Facebot|Twitterbot|WhatsApp|Slackbot|Discordbot|TelegramBot|LinkedInBot|bot|crawler|spider|preview|fetch/i.test(ua)
  if (!inApp && !bot && /iPhone|iPad|iPod|Macintosh/i.test(ua)) location.replace(STORE)
</script>
<link rel="icon" href="/img/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
</head>
<body><main>
  <img class="icon" src="/img/icon-512.png" alt="Songspot">
  <h1>songspot</h1>
  <p class="tag">Name the song from a tenth of a second.</p>
  <div class="zone">
  <a class="get" id="get" href="https://apps.apple.com/app/apple-store/id6808657554?pt=129407387&amp;ct=tiktok&amp;mt=8">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.37 12.6c-.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.7-3.18-1.73-1.35-.14-2.64.8-3.33.8-.69 0-1.74-.78-2.86-.76-1.47.02-2.83.86-3.59 2.17-1.530 2.65-.39 6.58 1.1 8.73.73 1.05 1.6 2.24 2.73 2.2 1.1-.04 1.51-.71 2.84-.71 1.32 0 1.7.71 2.86.69 1.18-.02 1.93-1.07 2.65-2.13.84-1.22 1.18-2.4 1.2-2.46-.03-.01-2.28-.88-2.3-3.490zM14.2 6.13c.6-.73 1.01-1.75.9-2.76-.87.04-1.92.58-2.54 1.31-.56.65-1.05 1.690-.92 2.68.97.08 1.96-.49 2.56-1.23z"/></svg>
    Get it on the App Store
  </a>
  </div>
  <div class="free">Free · iPhone and iPad</div>
  <div class="stuck" id="stuck"><span class="t">Nothing happening?</span>Tap <b>•••</b> in the top corner, then <b>Open in browser</b>.</div>
</main>
<script>
  // the glass's highlight follows the finger (or mouse) across the button
  var btn = document.getElementById('get')
  function glint(e) {
    var r = btn.getBoundingClientRect(), p = e.touches ? e.touches[0] : e
    btn.style.setProperty('--x', ((p.clientX - r.left) / r.width * 100).toFixed(1) + '%')
    btn.style.setProperty('--y', ((p.clientY - r.top) / r.height * 100).toFixed(1) + '%')
  }
  btn.addEventListener('pointermove', glint)
  btn.addEventListener('touchstart', glint, { passive: true })
  btn.addEventListener('touchmove', glint, { passive: true })
  document.getElementById('get').addEventListener('click', function () {
    document.getElementById('stuck').classList.add('on')
  })
</script>
</body></html>
