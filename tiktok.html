<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Songspot: Guess the song</title>
<meta name="description" content="Hear a tenth of a second. Name the song. Free on the App Store.">
<meta property="og:title" content="Songspot: Guess the song">
<meta property="og:description" content="Hear a tenth of a second. Name the song. Free on the App Store.">
<meta property="og:image" content="https://songspotapp.com/img/share-card.jpg">
<meta property="og:url" content="https://songspotapp.com/tiktok">
<meta property="og:type" content="website">
<meta name="apple-itunes-app" content="app-id=6808657554">
<meta name="robots" content="noindex">
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#030704;color:#f2f2f2;
    font:16px/1.5 -apple-system,system-ui,sans-serif;text-align:center;padding:0 16px;box-sizing:border-box}
  img{width:84px;height:84px;border-radius:20px}
  h1{font-size:30px;font-style:italic;letter-spacing:-.03em;margin:14px 0 6px}
  p{color:#a8a8a8;margin:0 0 24px}
  a.get{display:inline-block;background:#19df70;color:#04120a;font-weight:700;padding:15px 30px;border-radius:999px;text-decoration:none}
  .alt{margin-top:22px;font-size:14px;color:#8a8a8a}
  .alt a{color:#19df70}
  #stuck{display:none;margin-top:18px;font-size:13px;color:#8a8a8a}
</style>
<script>
  // The TikTok bio link. It carries the App Store campaign tag (ct=tiktok), so
  // App Store Connect counts these downloads under "tiktok".
  //
  // Safari and other browsers go straight on to the App Store. TikTok's own
  // in-app browser often refuses to open the App Store by itself, so there the
  // page stays and the player taps the button (a tap is always let through).
  var STORE = 'https://apps.apple.com/app/apple-store/id6808657554?pt=129407387&ct=tiktok&mt=8'
  var ua = navigator.userAgent || ''
  var inTikTok = /musical_ly|BytedanceWebview|TikTok|Bytedance/i.test(ua)
  var bot = /facebookexternalhit|Facebot|Twitterbot|WhatsApp|Slackbot|Discordbot|TelegramBot|LinkedInBot|bot|crawler|spider/i.test(ua)
  var android = /Android/i.test(ua)
  if (!inTikTok && !bot && !android) location.replace(STORE)
</script>
<link rel="icon" href="/img/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
</head>
<body><main>
  <img src="/img/icon-192.png" alt="">
  <h1>songspot</h1>
  <p>Name the song from a tenth of a second.</p>
  <a class="get" id="get" href="https://apps.apple.com/app/apple-store/id6808657554?pt=129407387&amp;ct=tiktok&amp;mt=8">Get it on the App Store</a>
  <p id="stuck">Nothing happening? Tap ••• at the top and choose “Open in browser”.</p>
  <div class="alt">On Android? <a href="/">Play free in your browser</a></div>
</main>
<script>
  document.getElementById('get').addEventListener('click', function () {
    setTimeout(function () { document.getElementById('stuck').style.display = 'block' }, 1500)
  })
</script>
</body></html>
