<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Songspot: Guess the song</title>
<meta name="description" content="Hear a tenth of a second. Name the song. Free on the App Store.">
<meta property="og:title" content="Songspot: Guess the song">
<meta property="og:description" content="Hear a tenth of a second. Name the song. Free on the App Store.">
<meta property="og:image" content="https://songspotapp.com/img/share-card.jpg">
<meta property="og:url" content="https://songspotapp.com/tiktok">
<meta property="og:type" content="website">
<meta name="apple-itunes-app" content="app-id=6808657554">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#030704">
<style>
  :root{color-scheme:dark;--green:#19df70;--ink:#f2f2f2;--mute:#8b918c}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#030704;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    display:grid;place-items:center;padding:24px 16px;text-align:center;
    background-image:radial-gradient(60% 40% at 50% 38%,rgba(25,223,112,.10),transparent 70%)}
  main{width:100%;max-width:340px}
  .icon{width:96px;height:96px;border-radius:22px;display:block;margin:0 auto;box-shadow:0 10px 40px rgba(25,223,112,.18)}
  h1{font-size:40px;font-weight:800;font-style:italic;letter-spacing:-.04em;margin:18px 0 4px;line-height:1}
  h1 span{color:var(--green)}
  .tag{color:var(--mute);margin:0 0 30px;font-size:16px}
  .get{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:999px;
    background:var(--green);color:#04120a;font-weight:700;font-size:17px;text-decoration:none;
    -webkit-tap-highlight-color:transparent;transition:transform .12s ease}
  .get:active{transform:scale(.97)}
  .get svg{width:20px;height:20px;fill:currentColor;margin-top:-2px}
  .free{margin-top:12px;font-size:13px;color:var(--mute)}
  .stuck{margin-top:22px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
    font-size:14px;line-height:1.45;color:#cfd3d0;opacity:0;transform:translateY(6px);transition:opacity .3s ease,transform .3s ease;pointer-events:none}
  .stuck.on{opacity:1;transform:none}
  .dots{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
    background:rgba(255,255,255,.12);font-weight:800;letter-spacing:1px;font-size:12px;vertical-align:-7px;margin:0 2px}
</style>
<script>
  // The TikTok bio link. It carries the App Store campaign tag (ct=tiktok), so
  // App Store Connect counts these downloads under "tiktok".
  //
  // Safari and other browsers go straight on to the App Store. TikTok's own
  // in-app browser often won't open the App Store by itself, so there the page
  // stays and the player taps the button (a tap is always let through).
  var STORE = 'https://apps.apple.com/app/apple-store/id6808657554?pt=129407387&ct=tiktok&mt=8'
  var ua = navigator.userAgent || ''
  var inApp = /musical_ly|BytedanceWebview|TikTok|Bytedance|Instagram|FBAN|FBAV/i.test(ua)
  var bot = /facebookexternalhit|Facebot|Twitterbot|WhatsApp|Slackbot|Discordbot|TelegramBot|LinkedInBot|bot|crawler|spider/i.test(ua)
  if (!inApp && !bot && /iPhone|iPad|iPod|Macintosh/i.test(ua)) location.replace(STORE)
</script>
<link rel="icon" href="/img/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
</head>
<body><main>
  <img class="icon" src="/img/icon-192.png" alt="Songspot">
  <h1>song<span>spot</span></h1>
  <p class="tag">Name the song from a tenth of a second.</p>
  <a class="get" id="get" href="https://apps.apple.com/app/apple-store/id6808657554?pt=129407387&amp;ct=tiktok&amp;mt=8">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.37 12.6c-.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.7-3.18-1.73-1.35-.14-2.64.8-3.33.8-.69 0-1.74-.78-2.86-.76-1.47.02-2.83.86-3.59 2.17-1.530 2.65-.39 6.58 1.1 8.73.73 1.05 1.6 2.24 2.73 2.2 1.1-.04 1.51-.71 2.84-.71 1.32 0 1.7.71 2.86.69 1.18-.02 1.93-1.07 2.65-2.13.84-1.22 1.18-2.4 1.2-2.46-.03-.01-2.28-.88-2.3-3.490zM14.2 6.13c.6-.73 1.01-1.75.9-2.76-.87.04-1.92.58-2.54 1.31-.56.65-1.05 1.690-.92 2.68.97.08 1.96-.49 2.56-1.23z"/></svg>
    Get it on the App Store
  </a>
  <div class="free">Free · iPhone and iPad</div>
  <div class="stuck" id="stuck">Nothing happening? Tap <span class="dots">•••</span> in the top corner and choose <b>Open in browser</b>.</div>
</main>
<script>
  document.getElementById('get').addEventListener('click', function () {
    setTimeout(function () { document.getElementById('stuck').classList.add('on') }, 1500)
  })
</script>
</body></html>
